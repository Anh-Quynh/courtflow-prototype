<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CourtFlow · Clickable Prototype</title><style>:root{font-family:Inter,Segoe UI,Arial,sans-serif;color:#19314b;background:#f3f6fb}*{box-sizing:border-box}body{margin:0}.top{background:#122b46;color:white;padding:22px 5%;display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap}.brand{font-size:25px;font-weight:800}.tag{background:#fff0c8;color:#76540a;padding:7px 11px;border-radius:25px;font-size:12px}.shell{max-width:1200px;margin:28px auto;padding:0 22px}.toolbar,.panel,.metric{background:white;border:1px solid #dce4ee;border-radius:15px;padding:20px;box-shadow:0 3px 14px #19314b0b}.toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap}select,input{padding:11px;border:1px solid #c9d5e2;border-radius:9px;min-width:140px}button{cursor:pointer;border:0;border-radius:9px;background:#126c8b;color:white;padding:12px 16px;font-weight:650}button.secondary{background:#e9f0f5;color:#1d4761}button:disabled{background:#e0e5ea;color:#8a98a4;cursor:not-allowed}.nav{display:flex;gap:8px;flex-wrap:wrap;margin:22px 0}.nav button.active{background:#173b5d}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}.panel{margin-bottom:16px}.panel h3{margin-top:0}.muted{color:#63778c}.pill{display:inline-block;background:#e5f5ec;color:#176341;border-radius:20px;padding:5px 9px;font-size:12px}.warning{background:#fff2dc;color:#79530e}.slots{display:flex;flex-wrap:wrap;gap:8px;margin-top:13px}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:12px 0}.metric strong{font-size:30px;display:block;margin-top:8px}.table{width:100%;border-collapse:collapse}.table td,.table th{text-align:left;padding:13px;border-bottom:1px solid #e4eaf1}.notice{background:#e7f5ff;padding:14px;border-radius:10px;margin:16px 0}.error{background:#fff0e8}.foot{margin:40px auto;text-align:center;color:#708196;font-size:12px}@media(max-width:650px){.table{font-size:12px}.table td,.table th{padding:6px}}</style><header class="top"><div class="brand">◈ CourtFlow <span style="font-size:13px;font-weight:400">UI/UX Prototype</span></div><span class="tag">DEMO DATA · NO REAL BOOKINGS OR PAYMENTS</span></header><main class="shell"><div class="toolbar"><strong>Test as role</strong><select id="role" onchange="setRole(this.value)"><option>Customer</option><option>Staff</option><option>Manager</option><option>Court Owner</option><option>Admin</option></select><span class="muted">Role switch simulates permissions; no authentication.</span></div><div class="nav" id="nav"></div><div id="message"></div><div id="content"></div></main><footer class="foot">CourtFlow concept · illustrative records stored in memory only · refresh resets demo</footer><script>
const navs={'Customer':['Search Courts','My Bookings','Membership','Reviews','Profile'],'Staff':['Counter Booking','Booking Lookup','Check-in','Payment Status'],'Manager':['Manager Overview','Bookings','Reports','Courts','Staff Management','Reviews'],'Court Owner':['Owner Overview','My Courts','Edit Court','Court Bookings','Performance','Review Responses'],'Admin':['Admin Overview','Accounts','Permissions','Membership Tiers','System Data','Review Moderation']};
const courts=[{id:'C01',name:'Badminton Court A',type:'Badminton',price:120000},{id:'C02',name:'Football Court B',type:'Football',price:250000},{id:'C03',name:'Tennis Court C',type:'Tennis',price:180000}];let role='Customer',page='Search Courts',selected=null,date='2026-10-20',bookings=[{id:'BK-1001',name:'Minh Anh',court:'Badminton Court A',date:'2026-10-20',time:'17:00',payment:'PAID',use:'NOT USED',source:'Sample'},{id:'BK-1002',name:'Lan Phuong',court:'Football Court B',date:'2026-10-20',time:'18:00',payment:'UNPAID',use:'NOT USED',source:'Sample'}];let findId='BK-1001';
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function note(t,err=false){document.getElementById('message').innerHTML='<div class="notice '+(err?'error':'')+'">'+escapeHtml(t)+'</div>'}function setRole(r){role=r;page=navs[r][0];selected=null;document.getElementById('message').innerHTML='';render()}function go(p){page=p;document.getElementById('message').innerHTML='';render()}function btn(p){return '<button class="secondary" onclick="go(&#39;'+p+'&#39;)">'+p+'</button>'}function render(){document.getElementById('role').value=role;document.getElementById('nav').innerHTML=navs[role].map(n=>'<button class="'+(n===page?'active':'secondary')+'" onclick="go(&#39;'+n+'&#39;)">'+n+'</button>').join('');let c=document.getElementById('content');if(page==='Search Courts'||page==='Counter Booking'||page==='Availability'){c.innerHTML='<div class="panel"><h2>'+(role==='Staff'?'Counter booking · Select court':'Find courts & availability')+'</h2><div class="row"><label>Date <input type="date" id="date" value="'+date+'" onchange="date=this.value;render()"></label><label>Type <select id="type" onchange="renderCourts()"><option>All</option><option>Badminton</option><option>Football</option><option>Tennis</option></select></label></div><div id="courtList" class="grid"></div><p class="muted">Availability is simulated. Booked slots are disabled.</p></div>';renderCourts();return}if(page==='Booking Confirmation'){c.innerHTML='<div class="panel"><h2>Booking confirmation</h2>'+(selected?'<p><b>Court:</b> '+selected.court.name+'</p><p><b>Date:</b> '+selected.date+'</p><p><b>Time:</b> '+selected.time+' (1 hour)</p><p><b>Illustrative price:</b> '+selected.court.price.toLocaleString('vi-VN')+' ₫</p>'+(role==='Staff'?'<label>Customer name <input id="customer" placeholder="Customer name" value="Walk-in customer"></label>':'')+'<div class="row"><button class="secondary" onclick="go(&#39;'+(role==='Staff'?'Counter Booking':'Search Courts')+'&#39;)">Back</button><button onclick="confirmBooking()">Record demo booking</button></div>':'<p>No slot selected.</p>')+'<p class="muted">Booking confirmation and payment policy are pending approval. This demo does not charge money.</p></div>';return}if(page==='Booking Result'){c.innerHTML='<div class="panel"><h2>Demo booking recorded</h2><p>'+escapeHtml(bookings[bookings.length-1].id)+'</p><p>Payment: UNPAID · Use: NOT USED</p>'+btn(role==='Staff'?'Booking Lookup':'My Bookings')+'</div>';return}if(['My Bookings','Bookings','Court Bookings','Booking Lookup','Check-in','Payment Status'].includes(page)){let b=role==='Customer'?bookings.filter(x=>x.source==='Customer'):role==='Court Owner'?bookings.filter(x=>x.court==='Badminton Court A'):bookings;let rows=b.map(x=>'<tr><td>'+x.id+'</td><td>'+escapeHtml(x.name)+'</td><td>'+x.court+'</td><td>'+x.date+' '+x.time+'</td><td>'+x.payment+'</td><td>'+x.use+'</td></tr>').join('');c.innerHTML='<div class="panel"><h2>'+page+'</h2>'+(role==='Staff'?'<div class="row"><input id="lookup" value="'+escapeHtml(findId)+'" placeholder="Booking ID"><button onclick="findBooking()">Find booking</button></div>':'')+'<div style="overflow-x:auto"><table class="table"><tr><th>ID</th><th>Customer</th><th>Court</th><th>Time</th><th>Payment</th><th>Use</th></tr>'+rows+'</table></div>'+(role==='Staff'?'<div id="bookingDetail"></div>':'')+'<p class="muted">Customer sees only bookings created in the Customer demo session; sample bookings belong to other illustrative customers.</p></div>';if(role==='Staff'&&page==='Check-in')showBooking();return}if(page==='Manager Overview'||page==='Owner Overview'||page==='Admin Overview'){let manager=role==='Manager';c.innerHTML='<h2>'+page+'</h2><div class="row"><label>Period <select onchange="note(&#39;Demo period selected; metrics are illustrative, not recalculated.&#39;)"><option>This week</option><option>This month</option></select></label><label>Facility <select onchange="note(&#39;Demo facility filter selected; real scoped data not connected.&#39;)"><option>Assigned facility (sample)</option><option>Facility A</option></select></label></div><div class="grid"><div class="metric">Bookings<strong>24</strong><span class="muted">Sample KPI</span></div><div class="metric">Revenue<strong>8.4M ₫</strong><span class="muted">Sample KPI</span></div><div class="metric">Utilization<strong>68%</strong><span class="muted">Sample KPI</span></div></div><div class="panel" style="margin-top:18px"><h3>Quick actions</h3><div class="row">'+(manager?btn('Bookings')+btn('Reports')+btn('Courts'):role==='Court Owner'?btn('My Courts')+btn('Performance'):btn('Accounts')+btn('Permissions'))+'</div><p class="muted">Numbers and facility scope are fictional. '+(manager?'Managers cannot create bookings.':'')+'</p></div>';return}if(page==='Reports'||page==='Performance'){c.innerHTML='<div class="panel"><h2>'+page+'</h2><p>Illustrative period summary: 24 bookings · 8,400,000 ₫ revenue · 68% utilization.</p><button onclick="note(&#39;Export is a demo placeholder; no file was generated.&#39;)">Export (demo)</button></div>';return}if(page==='My Courts'||page==='Edit Court'||page==='Courts'){c.innerHTML='<div class="panel"><h2>'+page+'</h2><p>Badminton Court A · 120,000 ₫ / hour · Sample status: Open</p>'+(role==='Court Owner'?'<label>Court price (demo) <input type="number" value="120000"></label> <button onclick="note(&#39;Demo change previewed; no database update.&#39;)">Preview changes</button>':'<p>Read-only scoped court information.</p>')+'</div>';return}c.innerHTML='<div class="panel"><h2>'+page+'</h2><p>This role-specific screen is represented in the dialog map. The detailed form is a prototype placeholder.</p><button onclick="note(&#39;Demo interaction only; no live records modified.&#39;)">Preview action</button></div>'}
function renderCourts(){let list=document.getElementById('courtList');if(!list)return;let t=document.getElementById('type').value;list.innerHTML=courts.filter(x=>t==='All'||x.type===t).map(x=>'<div class="panel"><span class="pill">'+x.type+'</span><h3>'+x.name+'</h3><p>'+x.price.toLocaleString('vi-VN')+' ₫ / hour</p><div class="slots">'+['17:00','18:00','19:00'].map(tm=>{let booked=bookings.some(b=>b.court===x.name&&b.date===date&&b.time===tm);return '<button '+(booked?'disabled title="Booked"':'onclick="choose(&#39;'+x.id+'&#39;,&#39;'+tm+'&#39;)"')+'>'+(booked?tm+' · Booked':tm)+'</button>'}).join('')+'</div></div>').join('')||'<p>No matching courts.</p>'}
function choose(id,time){if(!date){note('Please select a date.',true);return}selected={court:courts.find(x=>x.id===id),date,time};page='Booking Confirmation';render()}function confirmBooking(){if(!['Customer','Staff'].includes(role)){note('Role not authorized.',true);return}if(!selected)return;let name=role==='Staff'?document.getElementById('customer').value.trim():'Demo customer';if(!name){note('Customer name required.',true);return}if(bookings.some(b=>b.court===selected.court.name&&b.date===selected.date&&b.time===selected.time)){note('Slot no longer available. Please select another.',true);return}bookings.push({id:'BK-'+(1000+bookings.length+1),name,court:selected.court.name,date:selected.date,time:selected.time,payment:'UNPAID',use:'NOT USED',source:role});selected=null;page='Booking Result';render()}
function findBooking(){findId=document.getElementById('lookup').value.trim();showBooking()}function showBooking(){let d=document.getElementById('bookingDetail');if(!d)return;let b=bookings.find(x=>x.id.toUpperCase()===findId.toUpperCase());d.innerHTML=b?'<div class="notice"><b>'+b.id+'</b> · '+escapeHtml(b.name)+'<p>Payment: '+b.payment+' · Use: '+b.use+'</p><button onclick="checkin(&#39;'+b.id+'&#39;)" '+(b.use==='USED'?'disabled':'')+'>Confirm arrival (demo)</button><p class="muted">Unpaid check-in is a policy decision; demo requires manual review acknowledgement.</p></div>':'<div class="notice error">Booking not found in demo data.</div>'}function checkin(id){let b=bookings.find(x=>x.id===id);if(!b)return;if(b.payment==='UNPAID'&&!confirm('Unpaid booking: policy is undecided. Acknowledge manual review for this DEMO only?'))return;b.use='USED';note('Arrival recorded in temporary demo memory.');showBooking()}render();
</script></html>
